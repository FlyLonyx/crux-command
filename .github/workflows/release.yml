name: release

# Releases are never automatic. This runs when a version tag is deliberately pushed,
# or when started by hand from the Actions tab. The version comes from the pom, which
# is bumped in its own commit before tagging.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # The release profile additionally attaches the sources and Javadoc jars, and
      # fails on any Javadoc warning.
      - name: Verify
        run: mvn -B -ntp -Prelease verify

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            library/target/crux-command-*.jar
