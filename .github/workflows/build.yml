name: build

on:
  push:
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Java 8 is the target, so it is also what CI builds with: what the pipeline
      # compiles is exactly what a contributor compiles locally.
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      # Compiles, runs Checkstyle and SpotBugs, runs the tests, and enforces the
      # per-package coverage thresholds. Any one of them failing fails the build.
      - name: Verify
        run: mvn -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: library/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14
